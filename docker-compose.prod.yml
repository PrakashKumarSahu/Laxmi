services:
  # 1. PostgreSQL DBMS
  db:
    image: postgres:15-alpine
    container_name: laxmi_db_prod
    restart: always
    env_file: .env.prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laxmiuser -d laxmidb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Django REST Framework Backend (Gunicorn)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laxmi_backend_prod
    restart: always
    command: >
      sh -c "python manage.py migrate --no-input &&
             python seed_data.py &&
             gunicorn laxmi.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file: .env.prod
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # 3. React SPA Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: laxmi_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data_prod:
  static_volume:
  media_volume:
